# Adaptive Workforce AI — Local Development Docker Compose
# LOCAL DEPLOYMENT ONLY — not for production use without proper infrastructure review.
# No real credentials. All secrets must be configured via .env file.
# See .env.example for required variables.

version: "3.9"

services:

  # ── Main API service ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive_workforce_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ARTIFACT_STORE_PATH=/app/data/artifacts
      - AUDIT_LOG_PATH=/app/data/audit_logs
      - MODEL_STORE_PATH=/app/saved_models
      # NOTE: Never put real secrets here. Use a secrets manager in production.
    volumes:
      - ./data:/app/data
      - ./saved_models:/app/saved_models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

